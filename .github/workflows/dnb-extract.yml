name: Extract MCC DNB data
on:
  workflow_dispatch:
  push:
    branches: ["dnb-pipeline"]
    paths: ["tools/dnb/**", ".github/workflows/dnb-extract.yml"]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests beautifulsoup4 lxml pdfplumber
      - run: python3 tools/dnb/probe.py
      - name: Commit results
        if: always()
        run: |
          git config user.name "dnb-bot"
          git config user.email "dnb-bot@users.noreply.github.com"
          git add -f dnb-data
          git commit -m "DNB probe output" || echo "nothing"
          git push
