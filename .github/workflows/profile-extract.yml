name: Extract MCC profile data
on:
  workflow_dispatch:
  push:
    branches: ["profile-pipeline"]
    paths: ["tools/profile/**", ".github/workflows/profile-extract.yml"]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests pdfplumber
      - run: python3 tools/profile/extract_profiles.py
      - name: Commit results
        run: |
          git config user.name "profile-bot"
          git config user.email "profile-bot@users.noreply.github.com"
          git add -f profile-data
          git commit -m "Profile data CSV" || echo "nothing to commit"
          git push
