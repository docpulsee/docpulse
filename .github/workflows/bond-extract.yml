name: Extract MCC bond data
on:
  workflow_dispatch:
  push:
    paths: ["tools/bond/**", ".github/workflows/bond-extract.yml"]
    branches: ["bond-pipeline"]
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Install OCR tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-hin
          pip install requests
      - name: Run extraction
        run: python3 tools/bond/extract_bonds.py
      - name: Commit results
        run: |
          git config user.name "bond-bot"
          git config user.email "bond-bot@users.noreply.github.com"
          git add -f bond-data
          git commit -m "Bond data: PDFs, OCR text, summary" || echo "nothing to commit"
          git push
