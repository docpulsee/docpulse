<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEET PG Resident Directory</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <!-- Updated to use the latest, stable Supabase JS delivery bundle -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col">

    <!-- Header -->
    <header class="w-full bg-slate-800 border-b border-slate-700 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 flex sm:flex-row justify-between items-center gap-3">
            <div>
                <h1 class="text-xl font-bold text-white">NEET PG Resident Directory</h1>
                <p class="text-xs text-slate-400">138,000+ Verified Candidate Database</p>
            </div>
            <div class="flex items-center gap-3">
                <div class="bg-slate-700 border border-slate-600 rounded-lg px-3 py-1.5 text-xs">
                    <span class="text-slate-400">Selected:</span> 
                    <span id="selectedCount" class="font-bold text-indigo-400">0 PG(s)</span> | 
                    <span class="text-slate-400">Cost:</span> 
                    <span id="fCost" class="font-bold text-emerald-400">₹0</span>
                </div>
                <button onclick="openCheckout()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-4 py-2 rounded-lg transition">
                    Unlock Numbers
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col md:flex-row gap-3 md:items-center">
            <input type="text" id="searchInput" placeholder="Search by Candidate Name..." class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 w-full md:w-1/2 focus:outline-none focus:border-indigo-500">
            <input type="text" id="stateInput" placeholder="Filter by State (e.g. KARNATAKA)" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 w-full md:w-1/2 focus:outline-none focus:border-indigo-500">
            <button onclick="searchDatabase()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-6 py-2 rounded-lg text-sm transition">
                Search DB
            </button>
        </div>

        <!-- Directory Table -->
        <div class="mt-6 bg-slate-800 border border-slate-700 rounded-xl overflow-x-auto">
            <table class="w-full text-left text-sm">
                <thead class="bg-slate-950 text-slate-400 uppercase border-b border-slate-700">
                    <tr>
                        <th class="p-3 text-center">Select</th>
                        <th class="p-3">AIR Rank</th>
                        <th class="p-3">Candidate Name</th>
                        <th class="p-3">State & City</th>
                        <th class="p-3">Phone Number</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="divide-y divide-slate-700">
                    <tr>
                        <td colspan="5" class="p-6 text-center text-slate-400">Enter a candidate name or state above and tap Search DB.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <!-- Supabase Integration Initialization -->
    <script>
        const SUPABASE_URL = 'https://supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV3cnd0dHRrcXl3c21laGV4bWJmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzNjQyMDQsImV4cCI6MjEwNDk0MDIwNH0.hkwI81L-WS0ECygrrK3IXOOeSmIvDooW5NJQCi2o-Ys';
        
        // Correct global client initialization 
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let selectedMap = new Map();

        async function searchDatabase() {
            const query = document.getElementById('searchInput').value.trim();
            const stateQuery = document.getElementById('stateInput').value.trim();
            const tbody = document.getElementById('tableBody');

            tbody.innerHTML = '<tr><td colspan="5" class="p-6 text-center text-indigo-400 font-semibold animate-pulse">Searching Database...</td></tr>';

            try {
                // Queries standard CANDIDATE table
                let dbQuery = supabase.from('CANDIDATE').select('*');

                // Apply case-insensitive wildcard match filters
                if (query) {
                    dbQuery = dbQuery.ilike('NAME', `%${query}%`);
                }
                if (stateQuery) {
                    dbQuery = dbQuery.ilike('STATE', `%${stateQuery}%`);
                }

                // Enforce a hard cap row layout safety return limit
                dbQuery = dbQuery.limit(50);

                const { data, error } = await dbQuery;

                if (error) {
                    throw error;
                }

                if (!data || data.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="5" class="p-6 text-center text-amber-400 font-medium">
                                <i class="fa-solid fa-triangle-exclamation mr-2"></i> No records found.<br>
                                <span class="text-xs text-slate-400 block mt-1">If your table has rows, make sure Row Level Security (RLS) is turned off or has a public SELECT policy enabled on Supabase.</span>
                            </td>
                        </tr>`;
                    return;
                }

                tbody.innerHTML = '';
                data.forEach(item => {
                    // Normalizing fallback fields case-by-case to match varying schema formats
                    const id = item.id || item.RANK || item.rank || Math.random().toString();
                    const name = item.NAME || item.CANDIDATE_NAME || item.name || 'N/A';
                    const rank = item.RANK || item.AIR_RANK || item.rank || 'N/A';
                    const state = item.STATE || item.state || 'N/A';
                    const city = item.CITY || item.city || '';
                    const phone = item.PHONE || item.MOBILE || item.PHONE_NUMBER || item.phone || 'Locked';

                    const stateCity = city ? `${state}, ${city}` : state;
                    const isChecked = selectedMap.has(id);

                    const tr = document.createElement('tr');
                    tr.className = 'hover:bg-slate-800/50 transition';
                    
                    // Secure structural template parsing strings safely without breaking inline JS actions
                    tr.innerHTML = `
                        <td class="p-3 text-center">
                            <input type="checkbox" ${isChecked ? 'checked' : ''} class="row-checkbox w-4 h-4 rounded border-slate-700 bg-slate-900 text-indigo-600 focus:ring-0">
                        </td>
                        <td class="p-3 font-bold text-white">${rank}</td>
                        <td class="p-3 font-semibold text-indigo-400">${name}</td>
                        <td class="p-3 text-slate-400">${stateCity}</td>
                        <td class="p-3 font-mono text-slate-400">${phone}</td>
                    `;

                    // Using a programmatic safe event listener to prevent apostrophes (') in names from breaking the script
                    tr.querySelector('.row-checkbox').addEventListener('change', function() {
                        toggleSelect(id, name, rank, stateCity, phone);
                    });

                    tbody.appendChild(tr);
                });

            } catch (err) {
                console.error('Database Connection Error:', err);
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="p-6 text-center text-red-400 font-medium">
                            <i class="fa-solid fa-circle-exclamation mr-2"></i> Connection Failed!<br>
                            <span class="text-xs text-slate-400 block mt-1 font-mono">${err.message || err}</span>
                        </td>
                    </tr>`;
            }
        }

        function toggleSelect(id, name, rank, state, phone) {
            if (selectedMap.has(id)) {
                selectedMap.delete(id);
            } else {
                selectedMap.set(id, { id, name, rank, state, phone });
            }
            updateCart();
        }

        function updateCart() {
            const count = selectedMap.size;
            const cost = Math.ceil(count / 4) * 49;

            document.getElementById('selectedCount').innerText = `${count} PG(s)`;
            document.getElementById('fCost').innerText = `₹${cost}`;
        }

        function openCheckout() {
            if (selectedMap.size === 0) {
                alert('Please select at least 1 candidate.');
                return;
            }
            const count = selectedMap.size;
            const cost = Math.ceil(count / 4) * 49;
            alert(`Selected ${count} candidate(s). Total cost: ₹${cost}. Opening checkout window...`);
        }
    </script>
</body>
</html>
