<script>
// ONE-TIME LOCK LOGIC
(function(){
  try{
    const params = new URLSearchParams(window.location.search);
    const isPaidFresh = params.get('paid') === '1';
    
    // If coming from fresh payment, allow and clear old lock after 2 sec to allow this one report
    if(isPaidFresh){
      localStorage.setItem('docpulse_paid','true');
      localStorage.setItem('docpulse_paid_time', Date.now().toString());
      // Allow this session to generate report - remove old generated flag for this one time
      sessionStorage.setItem('allow_one_report','true');
      // Don't redirect, allow quiz
      return;
    }
    
    // Check if report already generated before
    const alreadyGenerated = localStorage.getItem('docpulse_report_generated') === 'true';
    const allowOne = sessionStorage.getItem('allow_one_report') === 'true';
    
    if(alreadyGenerated && !allowOne){
      // Already used - redirect to main site
      window.location.replace('https://docpulsee.github.io/docpulse/');
      return;
    }
    
    // Check paid status - if not paid at all, redirect to main
    if(!localStorage.getItem('docpulse_paid')){
      // If no paid flag and not paid fresh, redirect to main
      // Comment this if you want to allow free preview
      // window.location.replace('https://docpulsee.github.io/docpulse/');
    }
  }catch(e){}
})();
</script>
