<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Route Finder · DocPulse</title>
<meta name="description" content="For MBBS students, graduates and doctors: India PG, USA, UK, Germany, Australia, the Gulf, government service, public health or a non-clinical career? Answer 14 questions and find the route that fits you. Built on 2026 rules.">
<meta property="og:title" content="Where should your MBBS take you? · DocPulse Route Finder">
<meta property="og:description" content="14 honest questions, 9 routes after MBBS. See which one actually fits you.">
<meta name="theme-color" content="#0f1a20">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#f3f1e9; --card:#fffdf7; --card-2:#f8f5ec; --line:#e2ddcd; --line-2:#d3cdb9;
  --ink:#13212a; --ink-2:#4b5b61; --ink-3:#7c898c;
  --teal:#0f6e5c; --teal-2:#12917a; --teal-soft:#e3f1eb;
  --gold:#e3a72f; --gold-soft:#fbf1da; --red:#a2273a; --red-soft:#fbe8eb;
  --board:#0f1a20; --board-2:#16252d; --flap:#f4c152; --flap-dim:#7f93a0;
  --display:"Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:18px;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg); color:var(--ink); font:15px/1.55 var(--body); -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 1px 1px, rgba(19,33,42,.06) 1px, transparent 0); background-size:22px 22px;}
a{color:var(--teal)}
button{font:inherit; color:inherit; cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:1080px; margin:0 auto; padding-inline:16px}
.mono{font-family:var(--mono)}
.eyebrow{font:600 11px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}
h1,h2,h3{font-family:var(--display); letter-spacing:-.02em; text-wrap:balance; margin:0}

/* top bar */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:rgba(243,241,233,.86); backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
.top .wrap{display:flex; align-items:center; justify-content:space-between; height:56px; gap:12px}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none; color:var(--ink); font:800 17px var(--display)}
.brand i{width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg,#0ea5c6,#0f6e5c 60%,#34c38f); display:grid; place-items:center; color:#fff; font-style:normal; font-size:15px}
.pill{font:600 11px var(--mono); letter-spacing:.1em; text-transform:uppercase; padding:6px 10px; border-radius:99px; background:var(--board); color:var(--flap)}

/* screens */
.screen{animation:in .45s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:.001; transform:translateY(10px)} to{opacity:1; transform:none}}

/* ---------- intro ---------- */
.hero{display:grid; grid-template-columns:1.05fr 1fr; gap:40px; align-items:center; padding-block:48px 28px}
.hero h1{font-size:clamp(34px,5.4vw,58px); line-height:1.02; font-weight:800}
.hero h1 em{font-style:normal; color:var(--teal); position:relative; white-space:nowrap}
.hero h1 em::after{content:""; position:absolute; left:0; right:0; bottom:.04em; height:.16em; background:var(--gold); opacity:.55; border-radius:3px; z-index:-1}
.lead{font-size:17px; color:var(--ink-2); max-width:34em; margin:18px 0 26px}
.cta{display:inline-flex; align-items:center; gap:12px; border:0; border-radius:14px; padding:16px 22px 16px 24px; background:var(--teal); color:#fff; font:700 17px var(--display);
  box-shadow:0 1px 0 rgba(255,255,255,.25) inset, 0 12px 28px -12px rgba(15,110,92,.7); transition:transform .15s, box-shadow .15s}
.cta:hover{transform:translateY(-2px); box-shadow:0 1px 0 rgba(255,255,255,.25) inset, 0 18px 34px -14px rgba(15,110,92,.8)}
.cta svg{transition:transform .2s} .cta:hover svg{transform:translateX(4px)}
.cta.gold{background:linear-gradient(180deg,#f0b93f,#e0a027); color:#231a05; box-shadow:0 1px 0 rgba(255,255,255,.4) inset, 0 12px 28px -12px rgba(190,130,20,.8)}
.meta{margin-top:12px; font-size:13px; color:var(--ink-3)}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:26px}
.chip{display:inline-flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600; color:var(--ink-2); background:var(--card); border:1px solid var(--line); padding:7px 11px; border-radius:99px}
.chip b{width:7px; height:7px; border-radius:50%; background:var(--teal-2)}
.saved{margin-top:18px; display:flex; flex-wrap:wrap; align-items:center; gap:10px; background:var(--teal-soft); border:1px solid #bfe0d3; border-radius:12px; padding:10px 14px; font-size:14px}
.saved button{border:0; background:var(--teal); color:#fff; border-radius:9px; padding:7px 12px; font-weight:700; font-size:13px}

/* departure board */
.board{background:var(--board); border-radius:20px; padding:18px 16px 14px; color:#dfe7ea; box-shadow:0 30px 60px -30px rgba(15,26,32,.65), 0 0 0 1px #22343d inset; position:relative; overflow:hidden}
.board::before{content:""; position:absolute; inset:0; background:repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 2px, transparent 2px 4px); pointer-events:none}
.board-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; font:600 11px var(--mono); letter-spacing:.14em; color:var(--flap-dim)}
.board-head strong{color:var(--flap); font-size:13px; letter-spacing:.18em}
.brow{display:grid; grid-template-columns:48px 1fr auto; gap:10px; align-items:center; padding:7px 4px; border-top:1px solid #1f3039}
.brow .code{font:600 13px var(--mono); color:#0f1a20; background:var(--flap); border-radius:5px; text-align:center; padding:4px 0}
.brow .nm{font:600 14px var(--body); color:#eef3f5; min-width:0}
.brow .nm small{display:block; font:500 11px var(--mono); color:var(--flap-dim); letter-spacing:.06em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.flaps{display:flex; gap:2px}
.flaps span{display:inline-grid; place-items:center; width:13px; height:21px; background:var(--board-2); border-radius:3px; font:600 12px var(--mono); color:var(--flap); position:relative; box-shadow:0 1px 0 #000 inset}
.flaps span::after{content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:rgba(0,0,0,.55)}
.board-foot{margin-top:10px; display:flex; justify-content:space-between; font:500 11px var(--mono); color:var(--flap-dim); letter-spacing:.08em}
.blink{animation:blink 1.2s steps(2) infinite} @keyframes blink{50%{opacity:.25}}

.how{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; padding-block:18px 56px}
.how div{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px}
.how .n{font:600 12px var(--mono); color:var(--teal)}
.how h3{font-size:17px; margin:6px 0 4px}
.how p{margin:0; font-size:14px; color:var(--ink-2)}

/* ---------- quiz ---------- */
.quiz{max-width:760px; margin:0 auto; padding-block:26px 60px}
.path{position:relative; height:44px; margin-bottom:22px}
.path svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible}
.path .from,.path .to{position:absolute; top:50%; transform:translateY(-50%); font:600 11px var(--mono); letter-spacing:.1em; background:var(--card); border:1px solid var(--line); padding:4px 7px; border-radius:6px}
.path .from{left:0} .path .to{right:0}
.plane{position:absolute; top:50%; width:30px; height:30px; margin:-15px 0 0 -15px; transition:left .6s cubic-bezier(.3,.9,.3,1); color:var(--teal)}
.qhead{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px}
.qnum{font:600 13px var(--mono); color:var(--teal)}
.qcount{font:500 12px var(--mono); color:var(--ink-3)}
.qtitle{font-size:clamp(25px,3.6vw,34px); font-weight:700; line-height:1.12}
.qsub{color:var(--ink-2); margin:10px 0 22px}
.opts{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.opt{text-align:left; display:grid; grid-template-columns:34px 1fr; gap:12px; align-items:start; background:var(--card); border:1.5px solid var(--line); border-radius:16px; padding:16px; transition:border-color .15s, transform .15s, box-shadow .15s, background .15s}
.opt:hover{border-color:var(--line-2); transform:translateY(-2px); box-shadow:0 10px 24px -18px rgba(19,33,42,.5)}
.opt .k{width:34px; height:34px; border-radius:10px; border:1.5px solid var(--line-2); display:grid; place-items:center; font:600 13px var(--mono); color:var(--ink-2); background:var(--card-2); transition:.15s}
.opt .l{display:block; font-weight:700; font-size:15.5px; line-height:1.3}
.opt .h{display:block; font-size:13px; color:var(--ink-3); margin-top:3px}
.opt.sel{border-color:var(--teal); background:#f1f8f4; box-shadow:0 0 0 4px rgba(15,110,92,.12)}
.opt.sel .k{background:var(--teal); border-color:var(--teal); color:#fff}
.qnav{display:flex; justify-content:space-between; align-items:center; margin-top:22px}
.ghost{border:0; background:none; color:var(--ink-2); font-weight:600; padding:8px 4px; display:inline-flex; gap:6px; align-items:center}
.ghost:disabled{opacity:.35; cursor:default}
.kbd{font:500 12px var(--mono); color:var(--ink-3)}
.slide-out{animation:out .22s ease forwards} @keyframes out{to{opacity:0; transform:translateX(-18px)}}

/* ---------- calculating ---------- */
.calc{max-width:520px; margin:0 auto; padding-block:64px}
.calc h2{text-align:center; font-size:26px; margin-bottom:6px}
.calc p{text-align:center; color:var(--ink-2); margin:0 0 22px}

/* ---------- boarding pass ---------- */
.pass{display:grid; grid-template-columns:1fr 210px; background:var(--card); border-radius:22px; overflow:hidden; box-shadow:0 30px 60px -34px rgba(19,33,42,.55), 0 0 0 1px var(--line); position:relative}
.pass-main{padding:22px 24px; position:relative}
.pass-band{display:flex; justify-content:space-between; align-items:center; margin:-22px -24px 18px; padding:12px 24px; background:var(--board); color:var(--flap); font:600 11px var(--mono); letter-spacing:.16em}
.pass-band span:last-child{color:var(--flap-dim)}
.fly{display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:14px}
.fly .c{font:800 clamp(34px,5.2vw,56px)/1 var(--display); letter-spacing:-.03em}
.fly .c.to{color:var(--route,var(--teal))}
.fly small{display:block; font:600 11px var(--mono); letter-spacing:.1em; color:var(--ink-3); margin-bottom:4px}
.fly .n{font-size:13px; color:var(--ink-2); margin-top:4px}
.fly .line{min-width:48px; height:2px; background:repeating-linear-gradient(90deg,var(--line-2) 0 6px,transparent 6px 11px); position:relative}
.fly .line svg{position:absolute; left:50%; top:50%; width:26px; height:26px; transform:translate(-50%,-50%); color:var(--route,var(--teal)); background:var(--card); padding:2px}
.fields{display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); gap:12px; margin-top:20px; padding-top:16px; border-top:1px dashed var(--line-2)}
.fields small{display:block; font:600 10px var(--mono); letter-spacing:.12em; color:var(--ink-3)}
.fields b{font:700 15px var(--display)}
.stub{border-left:2px dashed var(--line-2); padding:22px 18px; background:var(--card-2); display:flex; flex-direction:column; justify-content:space-between; position:relative}
.stub::before,.stub::after{content:""; position:absolute; left:-12px; width:22px; height:22px; border-radius:50%; background:var(--bg)}
.stub::before{top:-11px} .stub::after{bottom:-11px}
.stub .big{font:800 46px/1 var(--display); color:var(--route,var(--teal))}
.stub .big sup{font-size:18px}
.stub .mini{font:600 10.5px/1.7 var(--mono); letter-spacing:.1em; color:var(--ink-3); margin-top:10px}
.stub .mini b{color:var(--ink)}
.mbar{position:fixed; left:0; right:0; bottom:0; z-index:30; display:none; align-items:center; gap:12px; padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px)); background:var(--board); color:#fff; box-shadow:0 -10px 30px -12px rgba(0,0,0,.5); transform:translateY(0); transition:transform .25s}
.mbar.off{transform:translateY(110%)}
.mbar div{flex:1; font-size:13px; line-height:1.3; color:#a9bac2}
.mbar div b{display:block; color:#fff; font:700 15px var(--display)}
.mbar button{border:0; border-radius:11px; padding:11px 16px; background:linear-gradient(180deg,#f0b93f,#e0a027); color:#231a05; font-weight:800; white-space:nowrap}
.barcode{height:46px; margin-top:14px; background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px,var(--ink) 4px 5px,transparent 5px 8px,var(--ink) 8px 11px,transparent 11px 12px); opacity:.85; border-radius:2px}

/* result */
.res{display:grid; grid-template-columns:1.25fr 1fr; gap:22px; padding-block:30px 60px; align-items:start}
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:20px}
.why{margin-top:16px; border-left:3px solid var(--route,var(--teal)); background:var(--card); border-radius:0 14px 14px 0; padding:14px 16px; font-size:15.5px}
.why .eyebrow{display:block; margin-bottom:6px}
.ranks h3{font-size:18px; margin-bottom:12px}
.rk{display:grid; grid-template-columns:44px 1fr 46px; gap:10px; align-items:center; padding:9px 0; border-top:1px solid var(--line)}
.rk:first-of-type{border-top:0}
.rk .code{font:600 12px var(--mono); text-align:center; padding:5px 0; border-radius:6px; color:#fff}
.rk .nm{font-weight:700; font-size:14.5px}
.rk .nm small{font-weight:500; color:var(--ink-3); font-size:12px; margin-left:6px}
.bar{height:8px; border-radius:99px; background:#ece8dc; overflow:hidden; margin-top:6px}
.bar i{display:block; height:100%; width:0; border-radius:99px; transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.rk .p{font:600 14px var(--mono); text-align:right; font-variant-numeric:tabular-nums}

.lock{position:sticky; top:72px; background:var(--board); color:#e7eef1; border-radius:22px; padding:22px; box-shadow:0 30px 60px -30px rgba(15,26,32,.7)}
.lock h3{font-size:24px; color:#fff; line-height:1.15}
.lock p{color:#a9bac2; font-size:14px; margin:8px 0 16px}
.inside{list-style:none; padding:0; margin:0 0 18px; display:grid; gap:9px}
.inside li{display:grid; grid-template-columns:22px 1fr; gap:8px; font-size:14px; color:#dbe5e9}
.inside li svg{color:var(--flap); margin-top:2px}
.ghostlines{position:relative; background:var(--board-2); border-radius:12px; padding:12px; margin-bottom:18px; overflow:hidden}
.ghostlines div{height:9px; border-radius:6px; background:#2a3d47; margin:8px 0}
.ghostlines::after{content:"🔒  Your personal roadmap"; position:absolute; inset:0; display:grid; place-items:center; font:600 12px var(--mono); letter-spacing:.08em; color:var(--flap); background:linear-gradient(180deg,rgba(22,37,45,.2),rgba(22,37,45,.85))}
.price{display:flex; align-items:baseline; gap:10px; margin-bottom:12px}
.price b{font:800 38px var(--display); color:#fff}
.price s{color:#7f93a0}
.price span{font:600 11px var(--mono); letter-spacing:.1em; color:var(--flap)}
.lock .cta{width:100%; justify-content:center}
.trust{display:flex; flex-wrap:wrap; gap:6px 14px; margin-top:12px; font-size:12px; color:#8fa3ac}
.restore{margin-top:14px; font-size:13px; color:#a9bac2}
.restore button.linkish{border:0; background:none; color:var(--flap); padding:0; font-weight:600; text-decoration:underline}
.restore form{display:flex; gap:8px; margin-top:8px}
.restore input{flex:1; min-width:0; background:#0b1418; border:1px solid #2a3d47; color:#fff; border-radius:9px; padding:9px 10px; font:500 13px var(--mono)}
.restore form button{border:0; background:var(--flap); color:#1b1400; border-radius:9px; padding:0 12px; font-weight:700}
.err{background:var(--red-soft); color:var(--red); border-radius:10px; padding:10px 12px; font-size:13.5px; margin-top:12px}
.lock .err{background:#3a1820; color:#ffb9c4}
.row-actions{display:flex; flex-wrap:wrap; gap:10px; margin-top:16px}
.btn2{display:inline-flex; align-items:center; gap:8px; border:1px solid var(--line-2); background:var(--card); border-radius:11px; padding:9px 13px; font-weight:600; font-size:13.5px; text-decoration:none; color:var(--ink)}
.btn2:hover{border-color:var(--ink-3)}
.fine{font-size:12px; color:var(--ink-3); margin-top:14px}

/* ---------- report ---------- */
.rep{padding-block:26px 70px}
.rep-bar{display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:10px; margin:16px 0 26px}
.rep-bar .eyebrow b{color:var(--ink)}
.tabs{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:18px}
.tab{flex:0 0 auto; display:flex; align-items:center; gap:10px; border:1.5px solid var(--line); background:var(--card); border-radius:14px; padding:10px 14px; font-weight:700}
.tab .code{font:600 11px var(--mono); color:#fff; border-radius:5px; padding:3px 6px}
.tab .p{font:600 12px var(--mono); color:var(--ink-3)}
.tab.on{border-color:var(--ink); background:var(--ink); color:#fff}
.tab.on .p{color:var(--flap)}
.panel h2{font-size:clamp(24px,3.4vw,32px); line-height:1.1; margin:6px 0 18px}
.two{display:grid; grid-template-columns:1fr 1fr; gap:14px}
.list{list-style:none; margin:0; padding:0; display:grid; gap:10px}
.list li{display:grid; grid-template-columns:22px 1fr; gap:8px; font-size:14.5px}
.ic{width:20px; height:20px; border-radius:6px; display:grid; place-items:center; font:700 12px var(--mono); margin-top:1px}
.ic.ok{background:var(--teal-soft); color:var(--teal)}
.ic.no{background:var(--gold-soft); color:#8a5a00}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:14px 0}
.stat{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px 16px}
.stat small{font:600 10.5px var(--mono); letter-spacing:.12em; color:var(--ink-3); text-transform:uppercase}
.stat b{display:block; font:700 17px/1.3 var(--display); margin-top:6px}
.sec-title{display:flex; align-items:center; gap:10px; margin:26px 0 12px; font-size:20px}
.sec-title .eyebrow{margin-left:auto}
.timeline{list-style:none; margin:0; padding:0; position:relative}
.timeline::before{content:""; position:absolute; left:17px; top:8px; bottom:8px; width:2px; background:repeating-linear-gradient(180deg,var(--line-2) 0 5px,transparent 5px 9px)}
.timeline li{display:grid; grid-template-columns:36px 1fr; gap:14px; padding:0 0 16px}
.timeline .dot{width:36px; height:36px; border-radius:50%; background:var(--card); border:2px solid var(--route,var(--teal)); display:grid; place-items:center; font:600 13px var(--mono); color:var(--route,var(--teal)); position:relative; z-index:1}
.timeline .body{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px}
.timeline .body b{font-size:15.5px}
.timeline .body p{margin:4px 0 0; font-size:14px; color:var(--ink-2)}
.when{display:inline-flex; align-items:center; gap:6px; margin-top:8px; font:600 11.5px var(--mono); color:var(--teal); background:var(--teal-soft); border-radius:6px; padding:3px 8px}
.costs{width:100%; border-collapse:collapse; font-size:14px}
.costs td{padding:9px 0; border-bottom:1px solid var(--line); vertical-align:top}
.costs td:last-child{text-align:right; font-family:var(--mono); font-size:13px; padding-left:12px; white-space:nowrap}
.costs tr.tot td{border-bottom:0; font-weight:700; padding-top:12px}
.costs tr.tot td:last-child{font:700 15px var(--display); color:var(--teal); white-space:normal}
.reality{border:1.5px solid #ecd49a; background:var(--gold-soft); border-radius:16px; padding:14px 16px; margin-top:16px; font-size:14.5px}
.reality .eyebrow{color:#8a5a00; display:block; margin-bottom:6px}
.links{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px}
.months{display:grid; grid-template-columns:repeat(3,1fr); gap:12px}
.month h4{margin:0 0 10px; font:700 15px var(--display)}
.check{display:grid; grid-template-columns:20px 1fr; gap:8px; font-size:14px; padding:6px 0; cursor:pointer}
.check input{accent-color:var(--teal); width:16px; height:16px; margin-top:3px}
.check input:checked + span{text-decoration:line-through; color:var(--ink-3)}
.tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:16px; background:var(--card)}
.cmp{border-collapse:collapse; width:100%; min-width:640px; font-size:13.5px}
.cmp th{font:600 10.5px var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); text-align:left; padding:12px 14px; border-bottom:1px solid var(--line); background:var(--card-2)}
.cmp td{padding:11px 14px; border-bottom:1px solid var(--line)}
.cmp tr:last-child td{border-bottom:0}
.cmp tr.me td{background:#f1f8f4; font-weight:600}
.cmp .code{font:600 11px var(--mono); color:#fff; border-radius:5px; padding:3px 6px; margin-right:6px}
.doc{background:var(--card); border:1px solid var(--line); border-radius:20px; padding:20px 22px; margin-top:18px}
.doc-meta{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; padding-bottom:14px; margin-bottom:14px; border-bottom:1px dashed var(--line-2)}
.doc-meta small{display:block; font:600 10px var(--mono); letter-spacing:.12em; color:var(--ink-3); text-transform:uppercase}
.doc-meta b{font:600 13.5px var(--body)}
.glance{font-size:16px; line-height:1.6; margin:0}
.snum{font:600 12px var(--mono); color:var(--ink-3); letter-spacing:.06em}
.stage{display:grid; grid-template-columns:auto 1fr; gap:10px; align-items:start; background:var(--teal-soft); border:1px solid #bfe0d3; border-radius:14px; padding:12px 14px; margin:0 0 14px; font-size:14.5px}
.stage b{font:600 11px var(--mono); letter-spacing:.1em; color:var(--teal); text-transform:uppercase; padding-top:3px}
.ic.x{background:var(--red-soft); color:var(--red)}
.elig{margin-top:14px}
.elig h3{font-size:17px; margin-bottom:12px}
.abroad{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px}
.door-card{background:var(--card); border:1px solid var(--line); border-top:4px solid var(--c); border-radius:16px; padding:16px}
.door-card .hd{display:flex; align-items:center; gap:10px; margin-bottom:8px}
.door-card .hd .code{font:600 11px var(--mono); color:#fff; border-radius:5px; padding:3px 6px; background:var(--c)}
.door-card .hd b{font:700 16px var(--display)}
.door-card .hd .p{margin-left:auto; font:600 13px var(--mono)}
.door{display:inline-block; font:600 11px var(--mono); letter-spacing:.06em; border-radius:99px; padding:3px 9px; margin-bottom:10px}
.door.open{background:var(--teal-soft); color:var(--teal)}
.door.effort{background:var(--gold-soft); color:#8a5a00}
.door.hard{background:var(--red-soft); color:var(--red)}
.door-card p{margin:0 0 10px; font-size:14px; color:var(--ink-2)}
.door-card .list li{font-size:13.5px}
.door-card .foot{margin-top:12px; padding-top:10px; border-top:1px dashed var(--line-2); font-size:13px; display:grid; gap:4px}
.door-card .foot span b{font-weight:600}
.teaser{margin-top:12px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; background:var(--card); border:1px dashed var(--line-2); border-radius:14px; padding:12px 14px; font-size:14px}
.teaser .code{font:600 11px var(--mono); color:#fff; border-radius:5px; padding:3px 6px}
.guide{display:grid; grid-template-columns:1fr auto; gap:16px; align-items:center; background:var(--board); color:#e7eef1; border-radius:20px; padding:22px; margin-top:28px}
.guide h3{color:#fff; font-size:21px}
.guide p{margin:6px 0 0; color:#a9bac2; font-size:14px}
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 16px; border-radius:12px; font-size:14px; z-index:50; box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
.spinner{width:18px; height:18px; border:2.5px solid rgba(255,255,255,.35); border-top-color:#fff; border-radius:50%; animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media (max-width: 860px){
  .hero{grid-template-columns:1fr; gap:28px; padding-top:28px}
  .res{grid-template-columns:1fr}
  .lock{position:static}
  .how{grid-template-columns:1fr}
  .months{grid-template-columns:1fr}
}
@media (max-width: 620px){
  .opts{grid-template-columns:1fr}
  .pass{grid-template-columns:1fr}
  .stub{border-left:0; border-top:2px dashed var(--line-2); flex-direction:row; align-items:center; gap:16px}
  .stub::before,.stub::after{top:-12px; left:auto}
  .stub::before{left:-11px} .stub::after{right:-11px; bottom:auto}
  .stub .barcode{flex:1; margin:0}
  .stub .mini{display:none}
  .mbar{display:flex}
  .res{padding-bottom:110px}
  .fields{grid-template-columns:1fr 1fr}
  .two,.stats{grid-template-columns:1fr}
  .guide{grid-template-columns:1fr}
  .board .brow{grid-template-columns:44px 1fr}
  .board .flaps{grid-column:2}
}
@media print{
  body{background:#fff}
  .top,.tabs,.rep-bar button,.guide,.row-actions,.no-print{display:none!important}
  .panel{display:block!important; break-inside:avoid-page; margin-bottom:24px}
  .check input{display:none}
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
</style>
</head>

        w: { govt: 1, industry: 2, de: 1, au: 1 }, why: { industry: "Non-clinical roles mostly keep regular office hours." } },
    ] });

function rfValidate(answers) {
  if (!answers || typeof answers !== "object") return false;
  return RF_QUESTIONS.every(q => q.options.some(o => o.id === answers[q.id]));
}

function rfScore(answers) {
  const raw = {}, min = {}, max = {}, reasons = {}, risks = {}, flags = {};
  RF_ORDER.forEach(r => { raw[r] = 0; min[r] = 0; max[r] = 0; reasons[r] = []; risks[r] = []; });
  RF_QUESTIONS.forEach(q => {
    RF_ORDER.forEach(r => {
      const ws = q.options.map(o => (o.w && o.w[r]) || 0);
      min[r] += Math.min(...ws); max[r] += Math.max(...ws);
    });
    const o = q.options.find(x => x.id === answers[q.id]);
    if (!o) return;
    if (o.flag) flags[o.flag] = true;
    RF_ORDER.forEach(r => {
      const w = (o.w && o.w[r]) || 0;
      raw[r] += w;
      if (w > 0 && o.why && o.why[r]) reasons[r].push({ w, text: o.why[r] });
      if (w < 0 && o.risk && o.risk[r]) risks[r].push({ w, text: o.risk[r] });
    });
  });
  const pct = {};
  RF_ORDER.forEach(r => {
    const span = max[r] - min[r] || 1;
    let p = Math.round(12 + 86 * (raw[r] - min[r]) / span);   // 12..98, never a fake 0 or 100
    if (r === "usa" && flags.budgetLow) p = Math.min(p, 30);
    if (r === "au" && flags.budgetLow) p = Math.min(p, 45);
    if (r === "de" && flags.noGerman) p = Math.min(p, 20);
    pct[r] = p;
    reasons[r].sort((a, b) => b.w - a.w); risks[r].sort((a, b) => a.w - b.w);
  });
  const ranked = RF_ORDER.slice().sort((a, b) => pct[b] - pct[a] || raw[b] - raw[a]);
  return { pct, ranked, reasons, risks, flags };
}

// What anyone sees for free.
function rfFreeResult(answers) {
  const s = rfScore(answers);
  const top = s.ranked[0];
  return { pct: s.pct, ranked: s.ranked, top, why: (s.reasons[top][0] || {}).text || "", nReasons: s.reasons[top].length, nRisks: s.risks[top].length };
}

      <div class="trust"><span>🔒 Secure payment via Razorpay</span><span>⚡ Instant access</span><span>✉️ Emailed to you</span></div>
      <div id="payErr"></div>
      <div class="restore">Already paid? <button class="linkish" id="rst">Open with your payment ID</button>
        <form id="rstForm" hidden><input id="rstId" placeholder="pay_XXXXXXXXXXXXXX" autocomplete="off"><button type="submit">Open</button></form>
      </div>
    </aside>
  </div>`);
  animateBars();
  const mb = document.createElement("div"); mb.className = "mbar"; mb.id = "mbar";
  mb.innerHTML = `<div><b>Your full plan to ${esc(r.name)}</b>Roadmap, costs, 90-day plan</div><button id="mpay">Unlock ₹${PRICE}</button>`;
  document.querySelector(".screen").appendChild(mb);
  document.getElementById("mpay").onclick = () => { document.querySelector(".lock").scrollIntoView({ behavior:"smooth", block:"start" }); };
  const lk = document.querySelector(".lock");
  if ("IntersectionObserver" in window) new IntersectionObserver(es => mb.classList.toggle("off", es[0].isIntersecting), { threshold:.15 }).observe(lk);
  document.getElementById("retake").onclick = () => { answers = {}; store.set("answers", answers); qi = 0; quiz(); };
  document.getElementById("copy").onclick = () => {
    const url = SITE + "/route-finder.html";
    (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(() => toast("Link copied"), () => toast(url));
  };
  document.getElementById("pay").onclick = pay;
  document.getElementById("rst").onclick = () => { document.getElementById("rstForm").hidden = false; document.getElementById("rstId").focus(); };
  document.getElementById("rstForm").onsubmit = e => { e.preventDefault(); openReport(document.getElementById("rstId").value.trim()); };
}

function payErr(msg){ const el = document.getElementById("payErr"); if (el) el.innerHTML = msg ? '<div class="err">' + msg + "</div>" : ""; }
function busy(on){ const b = document.getElementById("pay"); if (!b) return; b.disabled = on; b.innerHTML = on ? '<span class="spinner"></span> Preparing your report…' : "Unlock my full report " + ARROW; }

function pay(){
  payErr("");
  if (!window.Razorpay){ payErr("The payment window is still loading. Please try again in a few seconds."); return; }
  const fr = rfFreeResult(answers);
  const rzp = new window.Razorpay({
    key: RZP_KEY, amount: PRICE * 100, currency: "INR",
    name: "DocPulse", description: "Route Finder · full report",
    notes: { product: "route_finder", top: fr.top, year: answers.year },
    theme: { color: "#0f6e5c" },
    handler: r => unlock(r.razorpay_payment_id),
    modal: { ondismiss: () => busy(false) },
  });
  rzp.on("payment.failed", r => payErr("Payment failed: " + esc((r && r.error && r.error.description) || "unknown reason") + ". No money was taken. Please try again."));
  busy(true);
  rzp.open();
}

async function callFn(body){
  const res = await fetch(FN, { method:"POST", headers:{ "Content-Type":"application/json", apikey:SUPABASE_ANON, Authorization:"Bearer " + SUPABASE_ANON }, body: JSON.stringify(body) });
  let data = {}; try { data = await res.json(); } catch(e){}
  if (!res.ok || !data.ok){ const e = new Error(data.error || "Something went wrong (" + res.status + ")."); e.status = res.status; throw e; }
  return data;
}

async function unlock(paymentId, tries){
  tries = tries || 0;
  store.set("pay", paymentId);
  busy(true);
  try {
    const data = await callFn({ action:"unlock", payment_id: paymentId, answers });
    lastReport = data.report;
    history.replaceState(null, "", "?r=" + encodeURIComponent(paymentId));
    report(data.report, paymentId);
  } catch(e){
    if (tries < 2 && !(e.status >= 400 && e.status < 500)){ setTimeout(() => unlock(paymentId, tries + 1), 1500); return; }
    busy(false);
    payErr("Your payment went through (ID <b>" + esc(paymentId) + "</b>), but the report didn't load: " + esc(e.message) +
      ' <br><button class="btn2" style="margin-top:8px" id="retryUnlock">Try again</button>');
    const b = document.getElementById("retryUnlock"); if (b) b.onclick = () => unlock(paymentId);
  }
}

async function openReport(paymentId){
  if (!paymentId) return;
  show(`<div class="calc"><h2>Opening your report…</h2><p class="mono">${esc(paymentId)}</p></div>`);
  try {
    const data = await callFn({ action:"fetch", payment_id: paymentId });
    store.set("pay", paymentId);
    history.replaceState(null, "", "?r=" + encodeURIComponent(paymentId));
    report(data.report, paymentId);
  } catch(e){
    show(`<div class="calc"><h2>We couldn't open that report</h2><p>${esc(e.message)}</p>
      <div style="text-align:center"><button class="cta" id="home">Back to Route Finder</button></div>
      <p class="fine" style="text-align:center">Paid but stuck? Email docpulsee@gmail.com with your payment ID and we'll sort it out.</p></div>`);
    document.getElementById("home").onclick = () => { history.replaceState(null, "", location.pathname); intro(); };
  }
}

// ---------- full report ----------
function report(rep, paymentId){
  lastReport = rep;
  const top = rep.ranked[0], checks = store.get("checks_" + paymentId) || {};
  const fr = { ranked: rep.ranked, pct: rep.pct };
  show(`
  <div class="rep" style="--route:${R[top].accent}">
    ${passHTML(top, rep.pct[top], rep.year)}
    <div class="doc">
      <div class="doc-meta">
        <div><small>Report</small><b>DocPulse Route Report</b></div>
        <div><small>Prepared for</small><b>${esc(YEAR_LABEL[rep.year] || "You")}</b></div>
        <div><small>Based on</small><b>${RF_QUESTIONS.length} answers · 9 routes</b></div>
        <div><small>Rules &amp; fees checked</small><b>${esc(rep.checked)}</b></div>
      </div>
      <div class="snum" style="margin-bottom:6px">01 · AT A GLANCE</div>
      <p class="glance">${esc(rep.summary || "")}</p>
    </div>
    <div class="rep-bar">
      <span class="eyebrow">Report <b class="mono">${esc(paymentId)}</b> · saved on this device</span>
      <span style="display:flex; gap:8px; flex-wrap:wrap">
        <button class="btn2" id="pdf">Save as PDF</button>
        <button class="btn2" id="new">Take quiz again</button>
      </span>
    </div>

    <h3 class="sec-title"><span class="snum">02</span> Your top 3 routes</h3>
    <div class="tabs" role="tablist">
      ${rep.top3.map((t, i) => `<button class="tab ${i === 0 ? "on" : ""}" role="tab" data-i="${i}"><span class="code" style="background:${R[t.route].accent}">${R[t.route].code}</span>${i + 1}. ${esc(R[t.route].name)} <span class="p">${t.pct}%</span></button>`).join("")}
    </div>
    ${rep.top3.map((t, i) => panelHTML(t, i, rep.year)).join("")}

    <h3 class="sec-title"><span class="snum">03</span> Can you go abroad? Your 5 foreign doors <span class="eyebrow">at your stage</span></h3>
    <p style="margin:-4px 0 14px; color:var(--ink-2); font-size:14.5px">Whatever your top route, here is how each country looks for you as ${esc(({ y12:"a 1st/2nd-year MBBS student", y3f:"a 3rd/final-year MBBS student", intern:"an intern", grad:"an MBBS graduate", mo:"a working doctor", pg:"a PG doctor" })[rep.year] || "you")}, what's in your favour, and what's in the way.</p>
    <div class="abroad">${(rep.abroad || []).map(doorHTML).join("")}</div>

    <h3 class="sec-title"><span class="snum">04</span> Your first 90 days <span class="eyebrow">${esc(R[top].name)} · tick as you go</span></h3>
    <div class="months">
      ${rep.plan90.map((m, mi) => `<div class="card month"><h4>${esc(m.m)}</h4>
        ${m.items.map((it, ii) => { const id = mi + "_" + ii; return `<label class="check"><input type="checkbox" data-c="${id}" ${checks[id] ? "checked" : ""}><span>${esc(it)}</span></label>`; }).join("")}
      </div>`).join("")}
    </div>

    <h3 class="sec-title"><span class="snum">05</span> Your backup plan</h3>
    <div class="card" style="font-size:15px">${esc(rep.backup)}</div>

    <h3 class="sec-title"><span class="snum">06</span> All nine routes, side by side</h3>
    <div class="tablewrap"><table class="cmp">
      <thead><tr><th>Route</th><th>Your match</th><th>Total cost</th><th>Time to earning</th><th>Language</th><th>Settle for good?</th><th>Difficulty</th></tr></thead>
      <tbody>${rep.compare.map(c => `<tr class="${c.r === top ? "me" : ""}"><td><span class="code" style="background:${R[c.r].accent}">${R[c.r].code}</span>${esc(R[c.r].name)}</td><td class="mono">${rep.pct[c.r]}%</td><td>${esc(c.cost)}</td><td>${esc(c.time)}</td><td>${esc(c.lang)}</td><td>${esc(c.settle)}</td><td>${esc(c.hard)}</td></tr>`).join("")}</tbody>
    </table></div>
    <p class="fine">*Gulf: once you have the required experience. Costs are realistic ranges at September 2026 exchange rates and change over time.</p>

    <div class="guide">
      <div><h3>Want a doctor to go through this with you?</h3><p>Book a 1:1 guidance call with a current resident. Bring this report and we'll talk about your options honestly.</p></div>
      <a class="cta" href="${SITE}/#counselling">Book 1:1 guidance ${ARROW}</a>
    </div>
    <p class="fine">This report is a guide based on your answers, not a guarantee of admission, registration or a job. Rules and fees were checked in ${esc(rep.checked)}; always confirm on the official links before paying for any exam.</p>
  </div>`);
  const tabs = document.querySelectorAll(".tab");
  tabs.forEach(tb => tb.onclick = () => {
    tabs.forEach(x => x.classList.toggle("on", x === tb));
    document.querySelectorAll(".panel").forEach(p => p.hidden = p.dataset.i !== tb.dataset.i);
    const rr = rep.top3[+tb.dataset.i].route; document.querySelector(".rep").style.setProperty("--route", R[rr].accent);
  });
  document.querySelectorAll("[data-c]").forEach(cb => cb.onchange = () => { checks[cb.dataset.c] = cb.checked; store.set("checks_" + paymentId, checks); });
  document.getElementById("pdf").onclick = () => { document.querySelectorAll(".panel").forEach(p => p.hidden = false); window.print(); document.querySelectorAll(".panel").forEach(p => p.hidden = p.dataset.i !== document.querySelector(".tab.on").dataset.i); };
  document.getElementById("new").onclick = () => { history.replaceState(null, "", location.pathname); answers = {}; store.set("answers", answers); qi = 0; quiz(); };
}

function checkLI(k){ const m = { yes:["ok","✓"], maybe:["no","!"], no:["x","✗"] }[k.ok] || ["no","!"]; return `<li><span class="ic ${m[0]}">${m[1]}</span><span>${esc(k.t)}</span></li>`; }
function doorHTML(d){
  const r = R[d.route], cls = d.door === "Wide open" ? "open" : d.door === "Open with effort" ? "effort" : "hard";
  return `<div class="door-card" style="--c:${r.accent}">
    <div class="hd"><span class="code">${r.code}</span><b>${esc(r.name)}</b><span class="p">${d.pct}%</span></div>
    <span class="door ${cls}">${esc(d.door.toUpperCase())}</span>
    <p>${esc(d.note)}</p>
    <ul class="list">${d.checks.map(checkLI).join("")}</ul>
    <div class="foot"><span><b>First step:</b> ${esc(d.firstStep)}</span><span><b>Cost:</b> ${esc(d.total)}</span><span><b>Time to earning:</b> ${esc(d.time)}</span></div>
  </div>`;
}
function panelHTML(t, i, year){
  const r = R[t.route];
  return `
  <section class="panel" data-i="${i}" ${i ? "hidden" : ""} style="--route:${r.accent}">
    <div class="eyebrow">Route ${i + 1} · ${esc(r.long)} · ${t.pct}% match</div>
    <h2>${esc(t.headline)}</h2>
    ${t.stageNote ? `<div class="stage"><b>For you</b><span>${esc(t.stageNote)}</span></div>` : ""}
    <div class="two">
      <div class="card"><h3 style="font-size:17px; margin-bottom:12px">Why it fits you</h3>
        <ul class="list">${(t.reasons.length ? t.reasons : ["It scored well across your answers overall."]).map(x => `<li><span class="ic ok">✓</span><span>${esc(x)}</span></li>`).join("")}</ul></div>
      <div class="card"><h3 style="font-size:17px; margin-bottom:12px">Watch out for</h3>
        <ul class="list">${t.risks.map(x => `<li><span class="ic no">!</span><span>${esc(x)}</span></li>`).join("")}</ul></div>
    </div>
    ${t.checks && t.checks.length ? `<div class="card elig"><h3>Eligibility check</h3><ul class="list">${t.checks.map(checkLI).join("")}</ul></div>` : ""}
    <div class="stats">
      <div class="stat"><small>Total cost</small><b>${esc(t.total)}</b></div>
      <div class="stat"><small>First paycheck</small><b>${esc(t.timeToEarn)}</b></div>
      <div class="stat"><small>What you earn</small><b style="font-size:14.5px; font-family:var(--body); font-weight:600">${esc(t.earnings)}</b></div>
    </div>
    <h3 class="sec-title">Your roadmap <span class="eyebrow">timed for ${esc(YEAR_LABEL[year] || "you")}</span></h3>
    <ol class="timeline">
      ${t.steps.map((s, si) => `<li><span class="dot">${si + 1}</span><div class="body"><b>${esc(s.t)}</b><p>${esc(s.d)}</p>${s.when ? `<span class="when">⏱ ${esc(s.when)}</span>` : ""}</div></li>`).join("")}
    </ol>
    <h3 class="sec-title">What it costs</h3>
    <div class="card"><table class="costs">
      ${t.costs.map(c => `<tr><td>${esc(c.label)}</td><td>${esc(c.amt)}</td></tr>`).join("")}
      <tr class="tot"><td>Realistic total</td><td>${esc(t.total)}</td></tr>
    </table></div>
    <div class="reality"><span class="eyebrow">2026 reality check</span>${esc(t.reality)}</div>
    <div class="links">${t.links.map(l => `<a class="btn2" href="${esc(l.u)}" target="_blank" rel="noopener">${esc(l.t)} ↗</a>`).join("")}</div>
  </section>`;
}

// ---------- boot ----------
const qs = new URLSearchParams(location.search);
if (qs.get("r")) openReport(qs.get("r"));
else intro();
})();
</script>
